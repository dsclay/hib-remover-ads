<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; form-action https://duckduckgo.com">
<title>Home</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: #111418; color: #e6e9ed;
    font-family: system-ui, sans-serif; display: flex; flex-direction: column;
    align-items: center; padding: 18vh 20px 40px;
  }
  h1 { font-size: 28px; font-weight: 600; margin: 0 0 28px; letter-spacing: .3px; }
  h1 span { color: #f3b23c; }
  form { width: 100%; max-width: 520px; }
  input {
    width: 100%; height: 50px; border: 0; border-radius: 25px; padding: 0 22px;
    background: #1e2329; color: #e6e9ed; font-size: 16px; outline: none;
  }
  input:focus { box-shadow: 0 0 0 2px #f3b23c; }
  .hp-tiles {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px;
    width: 100%; max-width: 520px; margin-top: 34px;
  }
  .hp-tile {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    padding: 16px 6px; border-radius: 18px; background: #1e2329;
    color: inherit; text-decoration: none; font-size: 13px;
  }
  .hp-tile b {
    width: 40px; height: 40px; border-radius: 50%; background: #2a313a; color: #f3b23c;
    display: flex; align-items: center; justify-content: center; font-size: 18px;
  }
</style>
</head>
<body>
  <h1>Browse <span>freely</span></h1>
  <form action="https://duckduckgo.com/" method="get">
    <input name="q" type="search" placeholder="Search the web" autocomplete="off" enterkeyhint="search">
  </form>
  <div class="hp-tiles">
    <a class="hp-tile" href="https://m.youtube.com/"><b>Y</b>YouTube</a>
    <a class="hp-tile" href="https://www.google.com/"><b>G</b>Google</a>
    <a class="hp-tile" href="https://en.wikipedia.org/"><b>W</b>Wikipedia</a>
    <a class="hp-tile" href="https://github.com/"><b>H</b>GitHub</a>
    <a class="hp-tile" href="https://www.reddit.com/"><b>R</b>Reddit</a>
    <a class="hp-tile" href="https://duckduckgo.com/"><b>D</b>DuckDuckGo</a>
  </div>
</body>
</html>
