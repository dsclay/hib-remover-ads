<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; font-src https://appassets.androidplatform.net; form-action https://duckduckgo.com">
<title>Home</title>
<style>
  @font-face { font-family: ndot; src: url("ndot.ttf"); }
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100vh; color: #f2f2f2; font-family: system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; padding: 14vh 20px 40px;
    background:
      radial-gradient(50% 35% at 85% 6%, rgba(255,59,48,.20), transparent 70%),
      radial-gradient(60% 40% at 10% 100%, rgba(255,255,255,.06), transparent 70%),
      #000;
    background-attachment: fixed;
  }
  h1 { font-family: ndot, monospace; font-size: 30px; font-weight: 400; margin: 0 0 24px; letter-spacing: 2px; text-transform: uppercase; }
  h1 span { color: #ff3b30; }
  form { width: 100%; max-width: 400px; }
  input {
    width: 100%; height: 48px; border-radius: 24px; padding: 0 22px; font-size: 15px; outline: none;
    color: #f2f2f2; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14);
    -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.12);
  }
  input::placeholder { color: rgba(242,242,242,.45); }
  input:focus { border-color: #ff3b30; box-shadow: 0 0 0 3px rgba(255,59,48,.22); }
  .hp-tiles {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
    width: 100%; max-width: 400px; margin-top: 26px;
  }
  .hp-tile {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    padding: 13px 4px 11px; border-radius: 20px; color: inherit; text-decoration: none;
    font-family: ndot, monospace; font-size: 12px; letter-spacing: .5px; text-transform: uppercase;
    background: linear-gradient(160deg, rgba(255,255,255,.12), rgba(255,255,255,.04));
    border: 1px solid rgba(255,255,255,.13); box-shadow: 0 8px 24px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.16);
    -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
    transition: transform .15s ease, background .15s ease;
  }
  .hp-tile:active { transform: scale(.94); background: rgba(255,255,255,.14); }
  .hp-tile b {
    width: 38px; height: 38px; border-radius: 50%; color: #fff;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18);
  }
  .hp-tile svg { width: 20px; height: 20px; }
  .hp-tile:nth-child(1) b { color: #ff3b30; }
</style>
</head>
<body>
  <h1>Browse <span>freely</span></h1>
  <form action="https://duckduckgo.com/" method="get">
    <input name="q" type="search" placeholder="Search the web" autocomplete="off" enterkeyhint="search">
  </form>
  <div class="hp-tiles">
    <a class="hp-tile" href="https://m.youtube.com/"><b><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg></b><span>YouTube</span></a>
    <a class="hp-tile" href="https://www.google.com/"><b><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="11" cy="11" r="6" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></b><span>Google</span></a>
    <a class="hp-tile" href="https://en.wikipedia.org/"><b><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 6c-2-1.5-4.500-2-8-1.500v12.500c3.500-.5 6 0 8 1.500 2-1.500 4.500-2 8-1.500V4.500C16.500 4 14 4.500 12 6z M12 6v12.500" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></b><span>Wikipedia</span></a>
    <a class="hp-tile" href="https://github.com/"><b><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M9 7l-5 5 5 5M15 7l5 5-5 5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></b><span>GitHub</span></a>
    <a class="hp-tile" href="https://www.reddit.com/"><b><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M5 5h14a2 2 0 012 2v8a2 2 0 01-2 2h-7l-4.500 3.500V17H5a2 2 0 01-2-2V7a2 2 0 012-2z" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linejoin="round"/></svg></b><span>Reddit</span></a>
    <a class="hp-tile" href="https://duckduckgo.com/"><b><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 3l7.500 3v5.500c0 4.500-3 8-7.500 9.500C7.500 19.500 4.500 16 4.500 11.500V6z" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linejoin="round"/><path d="M8.500 12l2.500 2.500 4.500-5" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"/></svg></b><span>DuckDuckGo</span></a>
  </div>
</body>
</html>
